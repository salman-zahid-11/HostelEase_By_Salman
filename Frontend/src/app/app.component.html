<div class="min-h-screen bg-gray-50 flex flex-col font-sans">
  
  <!-- Global Navigation Bar -->
  <nav *ngIf="showNavbar()" class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-gray-100 transition-all duration-300">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-20 items-center">
        
        <!-- Logo / Branding -->
        <div class="flex items-center gap-3 cursor-pointer" routerLink="/">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-600 flex items-center justify-center text-white shadow-md shadow-indigo-200">
            <span class="text-xl font-black">H</span>
          </div>
          <div>
            <span class="text-2xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-violet-600 tracking-tight">HostelEase</span>
            <span class="block text-xs font-semibold text-gray-400 -mt-1 tracking-wider uppercase">Smart Maintenance</span>
          </div>
        </div>

        <!-- Middle navigation links -->
        <div *ngIf="isHomePage()" class="hidden md:flex items-center gap-8 font-semibold text-sm text-gray-500">
          <a href="#top" class="hover:text-indigo-600 transition">Home</a>
          <a href="#features" class="hover:text-indigo-600 transition">Features</a>
          <a href="#portals" class="hover:text-indigo-600 transition">Role Portals</a>
          <a href="#stats" class="hover:text-indigo-600 transition">System Status</a>
        </div>
        <!-- Middle navigation links when not on Home/Landing page -->
        <div *ngIf="!isHomePage()" class="hidden md:flex items-center gap-8 font-semibold text-sm text-gray-500">
          <a routerLink="/" class="hover:text-indigo-600 transition flex items-center gap-1">← Back to Home</a>
        </div>

        <!-- Action CTA / Dashboard link -->
        <div class="flex items-center gap-4">
          <ng-container *ngIf="currentUser; else authCTA">
            <span class="text-sm font-medium text-gray-600 hidden lg:inline">Signed in as <strong>{{ currentUser.fullName }}</strong></span>
            <div class="flex items-center gap-3">
              <button
                (click)="navigateToDashboard()"
                class="px-4 py-2 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-700 hover:to-violet-700 text-white text-sm font-bold rounded-xl shadow-md shadow-indigo-150 transition-all hover:scale-[1.02]"
              >
                Dashboard
              </button>
              <button
                (click)="logout()"
                class="px-3 py-2 bg-red-50 hover:bg-red-100 text-red-700 text-sm font-semibold rounded-lg transition"
                title="Sign out"
              >
                Sign Out
              </button>
            </div>
          </ng-container>
          <ng-template #authCTA>
            <button
              (click)="navigateToLogin('student')"
              class="px-4 py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-sm font-bold rounded-xl transition"
            >
              Sign In
            </button>
            <button
              (click)="navigateToRegister()"
              class="px-4 py-2 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-700 hover:to-violet-700 text-white text-sm font-bold rounded-xl shadow-md shadow-indigo-150 transition-all hover:scale-[1.02]"
            >
              Register
            </button>
          </ng-template>
        </div>

      </div>
    </div>
  </nav>

  <div class="flex-1 flex flex-col">
    <router-outlet></router-outlet>
  </div>
</div>
